<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="680" viewBox="0 0 1520 680" role="img" aria-labelledby="title description">
  <title id="title">Smoothly blending monotone slices into a bivariate target</title>
  <desc id="description">Three-panel illustration. First, monotone functions of x2 are generated at evenly spaced x1 grid points. Second, an x1 value between two adjacent grid points determines a relative coordinate t and smoothstep weight w of t. Third, the two adjacent monotone curves are combined by a convex blend, which remains monotone in x2 and joins neighboring intervals smoothly in x1.</desc>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7b8491"/>
    </marker>
    <marker id="axis-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#4b5563"/>
    </marker>
    <style>
      .title { font: 500 28px "Helvetica Neue", Arial, sans-serif; fill: #18212f; }
      .panel-title { font: 500 20px "Helvetica Neue", Arial, sans-serif; fill: #18212f; }
      .label { font: 400 17px "Helvetica Neue", Arial, sans-serif; fill: #283445; }
      .small { font: 400 15px "Helvetica Neue", Arial, sans-serif; fill: #5b6573; }
      .math { font: italic 18px Georgia, "Times New Roman", serif; fill: #202938; }
      .formula { font: italic 20px Georgia, "Times New Roman", serif; fill: #202938; }
      .condition { font: 400 18px Georgia, "Times New Roman", serif; fill: #202938; }
      .panel { fill: #fbfcfe; stroke: #d8dee8; stroke-width: 1.5; }
      .axis { fill: none; stroke: #4b5563; stroke-width: 1.5; }
      .guide { fill: none; stroke: #cbd2dc; stroke-width: 1.25; }
      .dashed { stroke-dasharray: 5 5; }
      .slice-neutral { fill: none; stroke: #8993a1; stroke-width: 2.4; stroke-linecap: round; }
      .slice-left { fill: none; stroke: #2f6fbb; stroke-width: 3; stroke-linecap: round; }
      .slice-right { fill: none; stroke: #d97928; stroke-width: 3; stroke-linecap: round; }
      .slice-blend { fill: none; stroke: #6556a8; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1520" height="680" fill="#ffffff"/>
  <text x="760" y="48" text-anchor="middle" class="title">Smoothly blending monotone slices</text>

  <!-- Panel backgrounds -->
  <rect x="35" y="82" width="420" height="555" rx="12" class="panel"/>
  <rect x="510" y="82" width="420" height="555" rx="12" class="panel"/>
  <rect x="985" y="82" width="500" height="555" rx="12" class="panel"/>

  <!-- Process arrows -->
  <path d="M 467 360 H 496" fill="none" stroke="#7b8491" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 942 360 H 971" fill="none" stroke="#7b8491" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Panel A: monotone slices -->
  <text x="62" y="120" class="panel-title">(a) Generate monotone slices</text>
  <text x="92" y="155" class="small">slice coordinate</text>
  <text x="241" y="155" class="small">function of x<tspan baseline-shift="sub" font-size="70%">2</tspan></text>

  <line x1="166" y1="170" x2="166" y2="602" class="guide"/>

  <text x="72" y="215" class="math">x<tspan baseline-shift="sub" font-size="70%">1</tspan> = ξ<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
  <circle cx="166" cy="209" r="4" fill="#8993a1"/>
  <path d="M 190 231 C 225 230, 236 220, 262 216 C 296 210, 307 198, 340 194 C 369 190, 384 176, 417 171" class="slice-neutral"/>

  <text x="119" y="274" class="label">⋮</text>
  <text x="292" y="274" class="label">⋮</text>

  <rect x="57" y="292" width="378" height="83" rx="8" fill="#2f6fbb" opacity="0.07"/>
  <text x="72" y="337" class="math" fill="#2f6fbb">x<tspan baseline-shift="sub" font-size="70%">1</tspan> = ξ<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <circle cx="166" cy="331" r="5" fill="#2f6fbb"/>
  <path d="M 190 354 C 224 352, 230 338, 262 334 C 299 330, 307 309, 341 303 C 373 298, 389 281, 417 274" class="slice-left"/>

  <rect x="57" y="386" width="378" height="83" rx="8" fill="#d97928" opacity="0.08"/>
  <text x="72" y="431" class="math" fill="#d97928">x<tspan baseline-shift="sub" font-size="70%">1</tspan> = ξ<tspan baseline-shift="sub" font-size="70%">i+1</tspan></text>
  <circle cx="166" cy="425" r="5" fill="#d97928"/>
  <path d="M 190 447 C 218 446, 231 438, 258 433 C 289 427, 303 415, 332 399 C 363 383, 388 381, 417 359" class="slice-right"/>

  <text x="119" y="505" class="label">⋮</text>
  <text x="292" y="505" class="label">⋮</text>

  <text x="72" y="562" class="math">x<tspan baseline-shift="sub" font-size="70%">1</tspan> = ξ<tspan baseline-shift="sub" font-size="70%">m</tspan></text>
  <circle cx="166" cy="556" r="4" fill="#8993a1"/>
  <path d="M 190 580 C 225 578, 239 569, 267 553 C 295 537, 322 532, 346 514 C 371 495, 393 493, 417 475" class="slice-neutral"/>

  <line x1="190" y1="606" x2="416" y2="606" class="axis" marker-end="url(#axis-arrow)"/>
  <text x="426" y="611" class="math">x<tspan baseline-shift="sub" font-size="70%">2</tspan></text>

  <!-- Panel B: interval and smoothstep weight -->
  <text x="537" y="120" class="panel-title">(b) Locate x<tspan baseline-shift="sub" font-size="70%">1</tspan> and compute its weight</text>

  <line x1="559" y1="199" x2="881" y2="199" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="586" y1="187" x2="586" y2="211" stroke="#2f6fbb" stroke-width="3"/>
  <line x1="850" y1="187" x2="850" y2="211" stroke="#d97928" stroke-width="3"/>
  <circle cx="692" cy="199" r="7" fill="#6556a8" stroke="#ffffff" stroke-width="2"/>
  <text x="586" y="236" text-anchor="middle" class="math" fill="#2f6fbb">ξ<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <text x="692" y="179" text-anchor="middle" class="math" fill="#6556a8">x<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
  <text x="850" y="236" text-anchor="middle" class="math" fill="#d97928">ξ<tspan baseline-shift="sub" font-size="70%">i+1</tspan></text>
  <path d="M 586 254 V 266 H 850 V 254" fill="none" stroke="#a9b1bd" stroke-width="1.5"/>
  <text x="718" y="288" text-anchor="middle" class="formula">t = (x<tspan baseline-shift="sub" font-size="70%">1</tspan> − ξ<tspan baseline-shift="sub" font-size="70%">i</tspan>) / (ξ<tspan baseline-shift="sub" font-size="70%">i+1</tspan> − ξ<tspan baseline-shift="sub" font-size="70%">i</tspan>)</text>

  <!-- Smoothstep plot -->
  <line x1="575" y1="500" x2="859" y2="500" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="575" y1="500" x2="575" y2="321" class="axis" marker-end="url(#axis-arrow)"/>
  <text x="865" y="506" class="math">t</text>
  <text x="559" y="316" class="math">w</text>
  <text x="575" y="522" text-anchor="middle" class="small">0</text>
  <text x="845" y="522" text-anchor="middle" class="small">1</text>
  <text x="557" y="505" text-anchor="end" class="small">0</text>
  <text x="557" y="335" text-anchor="end" class="small">1</text>
  <line x1="575" y1="330" x2="845" y2="330" class="guide dashed"/>
  <polyline points="575,500 588.5,499.8 602,498.5 615.5,495.5 629,490.2 642.5,482.5 656,472.3 669.5,460.1 683,446.0 696.5,430.9 710,415 723.5,399.1 737,384.0 750.5,369.9 764,357.7 777.5,347.5 791,339.8 804.5,334.5 818,331.5 831.5,330.2 845,330" fill="none" stroke="#6556a8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="683" y1="500" x2="683" y2="446" stroke="#6556a8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="575" y1="446" x2="683" y2="446" stroke="#6556a8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <circle cx="683" cy="446" r="5" fill="#6556a8" stroke="#ffffff" stroke-width="2"/>
  <text x="710" y="319" text-anchor="middle" class="formula">w(t) = 6t<tspan baseline-shift="super" font-size="70%">5</tspan> − 15t<tspan baseline-shift="super" font-size="70%">4</tspan> + 10t<tspan baseline-shift="super" font-size="70%">3</tspan></text>

  <!-- Weight bar -->
  <text x="575" y="556" class="small">convex weights at the selected x<tspan baseline-shift="sub" font-size="70%">1</tspan></text>
  <rect x="575" y="573" width="184" height="18" rx="4" fill="#2f6fbb"/>
  <rect x="759" y="573" width="86" height="18" rx="4" fill="#d97928"/>
  <text x="667" y="614" text-anchor="middle" class="small">1 − w(t) on f<tspan baseline-shift="sub" font-size="70%">i</tspan></text>
  <text x="802" y="614" text-anchor="middle" class="small">w(t) on f<tspan baseline-shift="sub" font-size="70%">i+1</tspan></text>

  <!-- Panel C: convex blend -->
  <text x="1012" y="120" class="panel-title">(c) Blend the neighboring slices</text>

  <line x1="1082" y1="443" x2="1404" y2="443" class="axis" marker-end="url(#axis-arrow)"/>
  <line x1="1082" y1="443" x2="1082" y2="175" class="axis" marker-end="url(#axis-arrow)"/>
  <text x="1411" y="449" class="math">x<tspan baseline-shift="sub" font-size="70%">2</tspan></text>
  <text x="1067" y="170" class="math">f</text>

  <path d="M 1093 420 C 1137 416, 1155 390, 1192 379 C 1228 369, 1251 338, 1288 321 C 1321 306, 1351 266, 1391 241" class="slice-left" opacity="0.8"/>
  <path d="M 1093 389 C 1130 386, 1152 371, 1183 347 C 1216 321, 1245 311, 1277 284 C 1308 259, 1341 251, 1391 207" class="slice-right" opacity="0.8"/>
  <path d="M 1093 410 C 1135 406, 1154 384, 1189 369 C 1224 354, 1249 329, 1285 309 C 1317 291, 1348 262, 1391 230" class="slice-blend"/>

  <line x1="1258" y1="443" x2="1258" y2="307" class="guide dashed"/>
  <circle cx="1258" cy="335" r="4.5" fill="#2f6fbb"/>
  <circle cx="1258" cy="300" r="4.5" fill="#d97928"/>
  <circle cx="1258" cy="324" r="6" fill="#6556a8" stroke="#ffffff" stroke-width="2"/>

  <line x1="1122" y1="160" x2="1152" y2="160" class="slice-left"/>
  <text x="1161" y="166" class="math" fill="#2f6fbb">f<tspan baseline-shift="sub" font-size="70%">i</tspan>(x<tspan baseline-shift="sub" font-size="70%">2</tspan>)</text>
  <line x1="1233" y1="160" x2="1263" y2="160" class="slice-right"/>
  <text x="1272" y="166" class="math" fill="#d97928">f<tspan baseline-shift="sub" font-size="70%">i+1</tspan>(x<tspan baseline-shift="sub" font-size="70%">2</tspan>)</text>
  <line x1="1122" y1="190" x2="1152" y2="190" class="slice-blend"/>
  <text x="1161" y="196" class="math" fill="#6556a8">f(x<tspan baseline-shift="sub" font-size="70%">1</tspan>, x<tspan baseline-shift="sub" font-size="70%">2</tspan>)</text>

  <rect x="1016" y="480" width="438" height="52" rx="8" fill="#6556a8" opacity="0.07"/>
  <text x="1235" y="513" text-anchor="middle" class="formula">f(x<tspan baseline-shift="sub" font-size="70%">1</tspan>,x<tspan baseline-shift="sub" font-size="70%">2</tspan>) = [1 − w(t)] f<tspan baseline-shift="sub" font-size="70%">i</tspan>(x<tspan baseline-shift="sub" font-size="70%">2</tspan>) + w(t) f<tspan baseline-shift="sub" font-size="70%">i+1</tspan>(x<tspan baseline-shift="sub" font-size="70%">2</tspan>)</text>

  <text x="1235" y="566" text-anchor="middle" class="condition">w(0) = 0,  w(1) = 1</text>
  <text x="1235" y="591" text-anchor="middle" class="condition">w′(0) = w′(1) = w″(0) = w″(1) = 0</text>
  <text x="1235" y="615" text-anchor="middle" class="small">Adjacent intervals meet C<tspan baseline-shift="super" font-size="70%">2</tspan>-smoothly in x<tspan baseline-shift="sub" font-size="70%">1</tspan>.</text>
  <text x="1235" y="634" text-anchor="middle" class="small">The convex blend remains increasing in x<tspan baseline-shift="sub" font-size="70%">2</tspan>.</text>
</svg>
